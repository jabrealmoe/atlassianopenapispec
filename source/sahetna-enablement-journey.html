<!doctype html><html lang="en" dir="ltr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patient Record Enablement Journey · Sahetna.tn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* Full-screen 3D patient-record journey. Stop chips on top, stop card bottom-start, HUD bottom-end.
   Logical properties throughout so the whole UI mirrors when Arabic turns the document RTL. */
:root {
  --sky: #e7eef2;
  --panel: rgba(250, 252, 253, 0.94);
  --fg: #16222b;
  --muted: #566a76;
  --line: #c3d2da;
  --sign: #0f6b7a;
  --sign-ink: #f2fbfd;
  --amber: #a85c00;
  --amber-fill: #f0a830;
  --guard: #2a6fa8;
  --human: #2f7d52;
  --live: #c23a2b;
  --cell-off: #d5e1e7;
  --code: #6c4bb6;
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-arabic: "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0b1418; --panel: rgba(14, 22, 27, 0.92); --fg: #e4eef3; --muted: #93a8b4; --line: #27373f;
    --sign: #2aa0b0; --sign-ink: #04181c; --amber: #f5bf52; --amber-fill: #f5bf52; --guard: #78b2f0;
    --human: #72d39b; --live: #ff6b5b; --cell-off: #22333a; --code: #b49bf0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0b1418; --panel: rgba(14, 22, 27, 0.92); --fg: #e4eef3; --muted: #93a8b4; --line: #27373f;
  --sign: #2aa0b0; --sign-ink: #04181c; --amber: #f5bf52; --amber-fill: #f5bf52; --guard: #78b2f0;
  --human: #72d39b; --live: #ff6b5b; --cell-off: #22333a; --code: #b49bf0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
/* Arabic gets a Naskh face and slightly looser lines for legibility */
html[lang="ar"] body { font-family: var(--font-arabic); }
html[lang="ar"] .card h2, html[lang="ar"] .brand h1, html[lang="ar"] .btn, html[lang="ar"] .chip { font-family: var(--font-arabic); }
html[lang="ar"] .bullet, html[lang="ar"] .tagline, html[lang="ar"] .work { line-height: 1.7; }
#app { position: relative; height: 100%; }
canvas#scene { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas#scene:active { cursor: grabbing; }

.topbar {
  position: absolute; inset-block-start: 0; inset-inline: 0;
  padding-block: 14px 0;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; letter-spacing: -0.01em; text-wrap: balance;
  background: var(--panel); padding: 4px 10px; border-radius: 6px; }
.brand span { font-size: 0.8rem; background: var(--panel); padding: 3px 8px; border-radius: 5px; }
.sim { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em;
  background: var(--live); color: #fff; padding: 3px 8px; border-radius: 5px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; pointer-events: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font-family: var(--font-display); font-weight: 700; font-size: 0.76rem; letter-spacing: 0.03em;
  padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center;
}
.chip b { font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.chip[aria-pressed="true"] b { color: var(--sign-ink); opacity: 0.8; }
.chip.dest { border-color: var(--amber); }
.chip:focus-visible, .btn:focus-visible, .bullet:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--amber-fill); outline-offset: 2px; }

.card {
  position: absolute; inset-inline-start: max(16px, env(safe-area-inset-left, 0px));
  inset-block-end: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(var(--card-w, 350px), calc(100% - 32px)); max-height: 56%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.18);
  transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.card.moved { transition: opacity .3s; }
.card.traveling { opacity: 0.08; pointer-events: none; transform: translateY(12px) scale(0.98); transition: opacity .35s, transform .35s; }
.card-head { display: flex; gap: 12px; align-items: stretch; padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  cursor: grab; user-select: none; touch-action: none; }
.card.dragging .card-head { cursor: grabbing; }
.card-tools { margin-inline-start: auto; display: flex; gap: 4px; align-items: flex-start; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); background: transparent; color: var(--fg);
  border-radius: 5px; font: 700 0.9rem/1 var(--font-mono); cursor: pointer; padding: 0; }
.icon-btn:hover { border-color: var(--sign); color: var(--sign); }
.now { display: none; margin: 2px 0 0; font-size: 0.82rem; line-height: 1.4; color: var(--amber); font-weight: 600; }
.card.compact { max-height: none; }
.card.compact .meter, .card.compact .card-body, .card.compact .tagline { display: none; }
.card.compact .now { display: block; }
.card.compact .card-head { border-bottom: 0; padding-block: 10px; }
.card.compact .shield { width: 40px; font-size: 1.3rem; }
.card.compact h2 { font-size: 1rem; }
.card.compact .card-foot { padding-block: 6px 8px; }
.card.compact .grip { display: none; }
.grip { position: absolute; inset-inline-end: 0; inset-block-end: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 50%, var(--line) 50%, var(--line) 58%, transparent 58%, transparent 70%, var(--line) 70%, var(--line) 78%, transparent 78%); }
html[dir="rtl"] .grip { cursor: nesw-resize; transform: scaleX(-1); }
.card.hidden-card { transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }
.shield {
  flex: 0 0 auto; width: 52px; background: var(--sign); color: var(--sign-ink); border-radius: 6px;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 1.7rem;
  border: 2px solid var(--sign-ink); outline: 2px solid var(--sign);
}
.shield.dest { background: var(--amber-fill); color: #1a1a1a; outline-color: var(--amber-fill); }
.head-text { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.livebadge { color: var(--live); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.livebadge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.04rem; line-height: 1.25; text-wrap: balance; }
.tagline { margin: 0; font-size: 0.85rem; color: var(--muted); line-height: 1.45; }

.meter { padding: 10px 16px 2px; display: flex; flex-direction: column; gap: 5px; }
.meter-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.cell { height: 7px; border-radius: 2px; background: var(--cell-off); transition: background .4s; }
.cell.ai { background: var(--amber-fill); }
.cell.hu { background: var(--human); }
.meter-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.64rem;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

.card-body { padding: 8px 16px 6px; overflow-y: auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.items { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.bullet {
  width: 100%; text-align: start; display: flex; gap: 9px; align-items: flex-start;
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 7px;
  font: inherit; font-size: 0.89rem; line-height: 1.45; color: var(--fg); cursor: pointer;
  transition: opacity .35s, background .3s, border-color .3s, transform .35s;
}
.bullet i { flex: 0 0 auto; font-style: normal; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); padding-top: 2px; }
.bullet.active { background: color-mix(in srgb, var(--amber-fill) 16%, transparent); border-color: color-mix(in srgb, var(--amber-fill) 55%, transparent); }
.bullet.active i { color: var(--amber); }
.bullet.pending { opacity: 0.22; }
.bullet.enter { animation: slideIn .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
html[dir="rtl"] @keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.work { padding: 9px 11px; border-radius: 6px; border: 1px dashed var(--line); font-size: 0.85rem; line-height: 1.5; }
.work strong { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  font-size: 0.68rem; color: var(--sign); display: block; margin-bottom: 3px; }
.roles { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.82rem; line-height: 1.45; }
.roles dt { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px; }
.roles dd { margin: 0; min-width: 0; }
.roles .you { color: var(--human); } .roles .ai { color: var(--amber); } .roles .gd { color: var(--guard); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px 12px; border-top: 1px solid var(--line); }
.steps { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px;
  padding: 7px 12px; font-family: var(--font-display); font-weight: 700; font-size: 0.79rem; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--sign); color: var(--sign); }
.btn:disabled { opacity: 0.4; cursor: default; }

.hud { position: absolute; inset-inline-end: max(16px, env(safe-area-inset-right, 0px));
  inset-block-end: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
html[dir="rtl"] .hud { align-items: flex-start; }
.keys { font-size: 0.71rem; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; line-height: 1.65; text-align: end; }
.keys kbd { font-family: var(--font-mono); font-size: 0.67rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.modes { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
.modes .btn { background: var(--panel); font-size: 0.73rem; padding: 5px 9px; }
.modes .btn[aria-pressed="true"] { border-color: var(--amber-fill); color: var(--amber); }
.langs { display: flex; gap: 4px; pointer-events: auto; }
.langs .btn { background: var(--panel); font-size: 0.73rem; padding: 5px 10px; font-family: var(--font-mono); }
.langs .btn[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.timer { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-variant-numeric: tabular-nums; }
.timer span { font-family: var(--font-mono); font-size: 0.67rem; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; align-self: center; }
.timer b { font-family: var(--font-display); font-size: 1.1rem; text-align: end; }
.timer b.warn { color: var(--amber); } .timer b.bad { color: var(--live); }
.timer button { grid-column: 1 / -1; margin-top: 4px; }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 820px) { .keys { display: none; } }
@media (max-width: 640px) {
  .card { inset-inline: 0; inset-block-end: 0; width: 100%; max-height: 52%; border-radius: 12px 12px 0 0;
    border-inline: 0; border-block-end: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .grip { display: none; }
  .card-head { cursor: default; }
  .hud { inset-block-end: auto; inset-block-start: calc(100px + env(safe-area-inset-top, 0px)); }
  .brand span.sub { display: none; }
}
</style>
</head><body>

<div id="app">
  <canvas id="scene" aria-label="3D visualization of a patient record moving between clinics, health centres and hospitals as the system matures"></canvas>
  <div class="topbar">
    <div class="brand">
      <h1 id="brandTitle"></h1>
      <span class="sub" id="brandSub"></span>
      <span class="sim" id="brandSim"></span>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Stops"></div>
  </div>

  <section class="card" id="card" aria-live="polite">
    <div class="card-head">
      <div class="shield" id="shield">0</div>
      <div class="head-text">
        <div class="eyebrow" id="eyebrow"></div>
        <h2 id="title"></h2>
        <p class="tagline" id="tagline"></p>
        <p class="now" id="now"></p>
      </div>
      <div class="card-tools">
        <button class="icon-btn" id="cCompact" type="button" aria-pressed="false" title="Collapse (C)">–</button>
        <button class="icon-btn" id="cReset" type="button" title="Reset size and position">↺</button>
      </div>
    </div>
    <div class="meter" aria-label="Who is steering">
      <div class="meter-row" id="meter"></div>
      <div class="meter-labels"><span id="mLabHuman"></span><span id="mLabAI"></span></div>
    </div>
    <div class="card-body">
      <ul class="items" id="items"></ul>
      <div class="work" id="work"></div>
      <dl class="roles" id="roles"></dl>
    </div>
    <div class="card-foot">
      <button class="btn" id="prev" type="button"></button>
      <span class="steps" id="steps"></span>
      <button class="btn" id="next" type="button"></button>
    </div>
    <div class="grip" id="grip"></div>
  </section>

  <div class="hud">
    <div class="timer" id="timer" hidden>
      <span id="tLabStop"></span><b id="tStop">0:00</b>
      <span id="tLabTotal"></span><b id="tTotal">0:00</b>
      <button class="btn" id="tReset" type="button"></button>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button class="btn" id="lang-ar" type="button" aria-pressed="false" lang="ar">العربية</button>
      <button class="btn" id="lang-fr" type="button" aria-pressed="false" lang="fr">Français</button>
      <button class="btn" id="lang-en" type="button" aria-pressed="true" lang="en">English</button>
    </div>
    <div class="modes">
      <button class="btn" id="mPresent" type="button" aria-pressed="false"></button>
      <button class="btn" id="mNight" type="button" aria-pressed="false"></button>
      <button class="btn" id="mTimer" type="button" aria-pressed="false"></button>
      <button class="btn" id="mOverview" type="button" aria-pressed="false"></button>
    </div>
    <div class="keys" id="keysHelp"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

// ============================================================================
// Patient Record Enablement Journey — an illustrative visualization of how a
// patient record moves between facilities as a health system matures, from a
// hand-carried paper carnet to a coded record that arrives before the patient.
//
// NOTHING HERE IS A LIVE SYSTEM. Every note, code, identifier and number on
// screen is synthetic and for teaching only. No real patient data is used,
// displayed, or implied. Facility nodes are generic TYPES, not named
// institutions, and this deck does not imply any organisation's participation
// in Tunisia's Sahetna.tn programme.
//
// Public facts referenced on the final stop come from Ecofin Agency's report of
// 22 July 2026 on Sahetna.tn and are attributed on screen.
// ============================================================================

// ---------- Language ----------
// Three fully-translated UI locales. Arabic flips the document to RTL; in-scene
// canvas text re-renders per language, so Arabic strings are drawn right-to-left

const LANGS = ["en", "fr", "ar"];
const RTL = { ar: true };

const UI = {
  en: {

          "<kbd>L</kbd> language · <kbd>C</kbd> compact · <kbd>H</kbd> hide · <kbd>0</kbd>–<kbd>6</kbd> jump",
    webglFail: "This visualization needs WebGL, which this browser isn't providing. The stop cards still work with the arrow keys.",
  },
  fr: {
    brand: "Le parcours vers le dossier patient numérique",

    human: "Le clinicien décide", ai: "Le système assiste",
    prev: "← Précédent", next: "Suivant →", point: (a, b) => `Point ${a} sur ${b}`,

          "<kbd>L</kbd> langue · <kbd>C</kbd> compact · <kbd>H</kbd> masquer · <kbd>0</kbd>–<kbd>6</kbd>",

  },
  ar: {
    brand: "مسار التحول إلى الملف الطبي الرقمي",
    sub: "من دفتر صحي يُحمل باليد إلى ملف يَسبق وصول المريض",
    sim: "محاكاة توضيحية · بيانات تركيبية",
    human: "الطبيب يقرّر", ai: "النظام يساعد",
    prev: "→ السابق", next: "التالي ←", point: (a, b) => `النقطة ${a} من ${b}`,
    level: (n) => "المستوى " + n, dest: "الوصول", live: "عرض مباشر",
    atWork: "في الميدان", inDemo: "في العرض التوضيحي",
    you: "الطبيب", aiRole: "النظام", guard: "ضمانة",
    present: "العارض", night: "ليل", timer: "المؤقّت", overview: "نظرة شاملة",
    thisStop: "هذه المرحلة", total: "الإجمالي / 30:00", resetTimers: "إعادة ضبط",
    keys: "<kbd>→</kbd> <kbd>←</kbd> المراحل · <kbd>مسافة</kbd> النقطة التالية<br>" +

    webglFail: "تتطلب هذه المحاكاة تقنية WebGL غير المتوفرة في هذا المتصفح. لا تزال البطاقات تعمل بمفاتيح الأسهم.",
  },

// Facility type names, used on in-scene node labels in all three languages

// ---------- 3D ----------
function initScene() {
  const canvas = $("scene");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.47;
  controls.minDistance = 5; controls.maxDistance = 260;
  const up = new THREE.Vector3(0, 1, 0);
  const nightHooks = [], relangHooks = [];

  const C = (h) => new THREE.Color(h);
  const lambert = (color, extra = {}) => new THREE.MeshLambertMaterial(Object.assign({ color }, extra));
  const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
  const m4 = new THREE.Object3D();
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  const glowTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,0.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);

  function glow(color, size, opacity = 0.9) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(size, size, 1); return s;
  }

  // --- Script-aware canvas text -------------------------------------------
  // Arabic must render right-to-left with a Naskh face and shaped glyphs. Canvas2D
  // does the shaping for us as long as we set direction/align correctly and do NOT
  // reverse the string ourselves. Latin text keeps its own face and LTR flow.
  const ARABIC_RE = /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/;
  function faceFor(text, weight, px) {
    return ARABIC_RE.test(text)
      ? `${weight} ${px}px "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif`
      : `${weight} ${px}px Archivo, Arial, sans-serif`;
  }
  // Draw one line of text honouring its script direction.
  function drawText(g, text, x, y, { rtl = null, align = null } = {}) {
    const r = rtl === null ? ARABIC_RE.test(text) : rtl;
    g.direction = r ? "rtl" : "ltr";
    g.textAlign = align || (r ? "right" : "left");
    g.fillText(text, x, y);
    g.direction = "ltr"; g.textAlign = "left";
  }
  // A floating label sprite. Arabic strings are right-aligned inside the plate.
  function label(text, { bg = "rgba(12,22,28,0.86)", fg = "#ffffff", h = 0.9, weight = 700, px = 54, accent = null } = {}) {
    const c = document.createElement("canvas"), g = c.getContext("2d");
    const font = faceFor(text, weight, px);

    const pad = 32, gutter = accent ? 22 : 0;
    const w = Math.ceil(g.measureText(text).width) + pad * 2 + gutter;
    c.width = Math.max(w, 48); c.height = Math.round(px * 1.78);

    s.scale.set(h * c.width / c.height, h, 1);

    return s;
  }
  // A label that rebuilds itself when the language changes.
  function liveLabel(key, opts) {
    let sprite = label(t(key), opts);
    const holder = new THREE.Group(); holder.add(sprite);
    relangHooks.push(() => {

  }

  // Sky
  const skyU = { top: { value: C("#5f9fd0") }, horizon: { value: C("#dceaf0") }, sunCol: { value: C("#fff6e0") }, sunDir: { value: new THREE.Vector3(1, 0.5, -0.2) } };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(520, 32, 16), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 sunCol; uniform vec3 sunDir; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = d.y;
        vec3 c = mix(horizon, top, smoothstep(-0.02, 0.55, h));
        c = mix(c, horizon * 0.82, smoothstep(0.0, -0.3, h));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        c += sunCol * (pow(s, 900.0) * 3.0 + pow(s, 40.0) * 0.32 + pow(s, 6.0) * 0.12);

  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85); scene.add(sun);
  scene.fog = new THREE.Fog(0xdceaf0, 150, 480);

  // --- Facility node graph -------------------------------------------------
  // Generic facility TYPES, laid out coast (dense, private, well-resourced) to
  // interior (sparse, public, remote). The gradient is the access argument.
  // No real institution is named or implied.
  const NODES = [
    { id: "cabinet",  key: FACILITY.cabinet,  x: -46, z:  10, tier: 0 },
    { id: "csb",      key: FACILITY.csb,      x: -16, z: -14, tier: 1 },
    { id: "regional", key: FACILITY.regional, x:  20, z:  12, tier: 2 },
    { id: "rural",    key: FACILITY.rural,    x:  34, z: -30, tier: 1, remote: true },
    { id: "chu",      key: FACILITY.chu,      x:  58, z:  -4, tier: 3 },
  ];
  const NODE = {};
  NODES.forEach((n) => { NODE[n.id] = n; });
  // The national portal floats above the middle of the country, not on the ground
  const PORTAL_POS = new THREE.Vector3(12, 26, -6);

  // Terrain: coastal green through dry interior, with a ridge behind the remote site
  const GW = 300, GD = 240;
  const gGeo = new THREE.PlaneGeometry(GW, GD, 120, 96); gGeo.rotateX(-Math.PI / 2);
  const gp = gGeo.attributes.position, gcol = [];
  const tmpc = new THREE.Color();
  const coastal = C("#7a9a5c"), inland = C("#c2ad7c"), dry = C("#d8bd8c"), rockC = C("#b08a5e"), seabedC = C("#c9bb99");
  // A ridge between the remote dispensary and everything else: why transfer is hard
  const RIDGE = { x: 40, z: -48, ang: -0.5, len: 56, half: 13, h: 17 };
  const rca = Math.cos(RIDGE.ang), rsa = Math.sin(RIDGE.ang);
  function ridgeH(x, z) {
    const dx = x - RIDGE.x, dz = z - RIDGE.z;
    const along = dx * rca + dz * rsa, across = -dx * rsa + dz * rca;
    return RIDGE.h * smooth(RIDGE.len, RIDGE.len * 0.3, Math.abs(along))
         * smooth(RIDGE.half, RIDGE.half * 0.18, Math.abs(across))
         * (1 + 0.15 * Math.sin(along * 0.4));
  }
  // Shoreline on the -x edge: the Mediterranean behind the first facility
  const shoreAt = (z) => -66 + 4 * Math.sin(z * 0.07) + 2.5 * Math.sin(z * 0.023 + 1);
  const landAmt = (x, z) => smooth(shoreAt(z) - 6, shoreAt(z) + 7, x);
  // Keep the ground flat under each facility so buildings do not float or sink
  function padFlat(x, z) {
    let m = 1e9;
    for (const n of NODES) m = Math.min(m, Math.hypot(n.x - x, n.z - z));
    return smooth(4, 13, m);
  }
  function heightAt(x, z) {
    const land = landAmt(x, z), flat = padFlat(x, z);
    const rolling = 2.2 + 1.6 * Math.sin(x * 0.05 + 0.4) * Math.cos(z * 0.06) + 0.9 * Math.sin(x * 0.11 + z * 0.08);

    return { h, land };
  }
  for (let v = 0; v < gp.count; v++) {
    const x = gp.getX(v), z = gp.getZ(v);
    const { h, land } = heightAt(x, z);
    gp.setY(v, h);
    const grain = 0.5 + 0.5 * Math.sin(x * 0.2) * Math.cos(z * 0.17);

  // The sea, so "coastal" reads at a glance
  const seaU = { time: { value: 0 }, deep: { value: C("#0c4a8e") }, shallow: { value: C("#2aa0bd") },

  const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.ShaderMaterial({
    uniforms: seaU,
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform float time; uniform vec3 deep; uniform vec3 shallow; uniform vec3 horizon; uniform vec3 sunCol; uniform vec3 sunDir;
      uniform vec3 fogColor; uniform float fogNear; uniform float fogFar; varying vec3 vW;
      float wave(vec2 p){ return sin(p.x*0.3+time*1.0)*0.5 + sin(p.y*0.4-time*0.85)*0.4 + sin((p.x+p.y)*0.8+time*1.6)*0.18; }

  // Sparse dry scenery, denser toward the coast
  const palms = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.1, 0.17, 3.2, 6), lambert(0xffffff, { flatShading: true }), 60);

  let seed = 11; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // --- Facility buildings --------------------------------------------------

  const wallM = lambert("#e9e3d6", { flatShading: true });

  function medCross(size = 0.5) {
    const g = new THREE.Group();

  const facilities = {};

  // --- Data rails between facilities --------------------------------------
  // Blue = deterministic plumbing, the same grammar the rest of the deck uses.

  const RAILS = [
    ["cabinet", "csb"], ["csb", "regional"], ["regional", "chu"], ["rural", "regional"],
  ];
  const railMat = lambert("#2a6fa8", { emissive: "#0d2f52", emissiveIntensity: 0.6 });
  const railSegs = [];
  RAILS.forEach(([a, b], ri) => {

    const steps = 22;
    const pts = [];
    for (let i = 0; i <= steps; i++) {

      const x = from.x + (to.x - from.x) * f, z = from.z + (to.z - from.z) * f;
      // Follow the ground, lifted a little, arcing over the ridge where needed

  // --- The hero: the record itself ----------------------------------------
  // Four forms, crossfaded by maturity:
  //   paper   — a manila carnet the patient carries

  //   token   — a luminous identifier that needs no paper at all
  const record = (() => {
    const g = new THREE.Group(); scene.add(g);

    // paper carnet
    const paper = new THREE.Group(); g.add(paper);
    const manila = lambert("#d8c48e", { flatShading: true });
    const cover = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.86), manila); paper.add(cover);

    }

    bentCorner.position.set(0.22, 0.062, 0.33); bentCorner.rotation.set(0, 0.5, 0.25); paper.add(bentCorner);

    // folder with a glowing page

    const fCover = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.06, 0.9), lambert("#b9c8d2", { flatShading: true })); folder.add(fCover);
    const pageM = new THREE.MeshLambertMaterial({ color: "#ffffff", emissive: "#2aa0bd", emissiveIntensity: 0.55 });
    const page = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.02, 0.82), pageM); page.position.y = 0.05; folder.add(page);
    const pageGlow = glow("#5fd0e8", 1.5, 0.5); pageGlow.position.y = 0.16; folder.add(pageGlow);

    // structured cards with code chips
    const cards = new THREE.Group(); g.add(cards);
    const cardM = lambert("#f4f8fa", { flatShading: true });
    const chipM = lambert("#6c4bb6", { emissive: "#2d1a5e", emissiveIntensity: 0.6 });
    const cardStack = [];
    for (let k = 0; k < 4; k++) {
      const cg = new THREE.Group(); cg.position.y = k * 0.1;
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.05, 0.88), cardM); cg.add(c);
      const chip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.055, 0.3), chipM); chip.position.set(-0.29, 0.005, -0.25); cg.add(chip);
      cards.add(cg); cardStack.push(cg);
    }

    // identifier token: a hex chip with an engraved rim
    const token = new THREE.Group(); g.add(token);
    const tokM = new THREE.MeshLambertMaterial({ color: "#2aa0bd", emissive: "#1b7d94", emissiveIntensity: 0.9, flatShading: true });
    const hex = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.12, 6), tokM); token.add(hex);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.035, 6, 6), lambert("#f0a830", { emissive: "#6a4200", emissiveIntensity: 0.6 }));
    rim.rotation.x = Math.PI / 2; token.add(rim);
    const tokGlow = glow("#7fe4f8", 2.6, 0.85); token.add(tokGlow);
    // A small health-ID token that clips onto the folder from level 2 onward

    const clipHex = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.06, 6), tokM);
    clipHex.position.set(0.24, 0.1, -0.3); clip.add(clipHex);
    const clipGlow = glow("#7fe4f8", 0.9, 0.7); clipGlow.position.copy(clipHex.position); clip.add(clipGlow);

    const forms = { paper, folder, cards, token };
    // Which form belongs to which level
    const FORM_AT = ["paper", "folder", "folder", "cards", "cards", "cards", "token"];
    function setForm(level, snap) {
      const want = FORM_AT[level];
      Object.entries(forms).forEach(([k, grp]) => {
        const on = k === want;
        grp.userData.want = on ? 1 : 0;

    function update(dt, time) {
      Object.values(forms).forEach((grp) => {
        const d = grp.userData;
        d.s += (d.want - d.s) * Math.min(1, dt * 5);

        if (grp.visible) grp.scale.setScalar(Math.max(0.0001, d.s));
      });

      tokGlow.material.opacity = 0.65 + Math.sin(time * 2.4) * 0.2;
      token.rotation.y = time * 0.9;
      rim.rotation.z = time * 1.4;

    }
    return { g, setForm, update, forms };
  })();

  // --- The patient ---------------------------------------------------------

  patientLab.position.y = 1.9; patient.add(patientLab);

    c.rotation.y = -0.5;
    scene.add(c);
    clinicians[n.id] = c;
  });

  // --- The coding beat: free text to confirmed ICD-10 ----------------------
  // Note renders in the viewer's language (RTL for Arabic). Candidate codes
  // crystallize amber with confidence rings; the clinician confirms exactly one,
  // which turns green. The CODE never changes with language — only its label.
  const coding = (() => {
    const anchor = facilities[NODES[0].id];
    const g = new THREE.Group();
    g.position.set(anchor.node.x, anchor.y, anchor.node.z);
    scene.add(g);

    // Note sprite: a sheet of free text, wrapped, in the active language
    function noteTexture(text) {
      const W = 760, H = 300;
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d");
      x.fillStyle = "#fbf9f2"; rr(x, 4, 4, W - 8, H - 8, 18); x.fill();
      x.strokeStyle = "#c8bfa8"; x.lineWidth = 3; rr(x, 12, 12, W - 24, H - 24, 14); x.stroke();
      const ar = ARABIC_RE.test(text);
      // Ruled lines, like a note pad
      x.strokeStyle = "rgba(90,110,120,0.16)"; x.lineWidth = 2;
      for (let k = 1; k < 5; k++) { x.beginPath(); x.moveTo(34, 60 + k * 48); x.lineTo(W - 34, 60 + k * 48); x.stroke(); }
      x.font = faceFor(text, 400, 34);
      x.fillStyle = "#1d2b33"; x.textBaseline = "middle";
      // Word wrap honouring direction
      const words = text.split(/\s+/), lines = [];
      let line = "";
      for (const w of words) {
        const trial = line ? line + " " + w : w;
        if (x.measureText(trial).width > W - 80 && line) { lines.push(line); line = w; } else line = trial;
      }
      if (line) lines.push(line);
      const startX = ar ? W - 40 : 40;
      lines.slice(0, 5).forEach((ln, k) => drawText(x, ln, startX, 62 + k * 48, { rtl: ar }));
      // A small language tag in the corner
      x.font = `500 22px "IBM Plex Mono", monospace`;
      x.fillStyle = "#6b7f8a";
      drawText(x, ar ? "AR" : (lang === "fr" ? "FR" : "EN"), ar ? 40 : W - 40, H - 34, { rtl: false, align: ar ? "left" : "right" });
      const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4; return tex;
    }
    let noteTex = noteTexture(t(CODING[0].note));
    const note = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 1.34),
      new THREE.MeshBasicMaterial({ map: noteTex, transparent: true, side: THREE.DoubleSide }));
    note.position.set(0, 3.4, 2.2); g.add(note);

    // Code chips: a plate with the invariant code and its language-dependent label
    function chipTexture(code, labelText, state) {
      const W = 620, H = 180;
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d");
      const bg = state === "ok" ? "#11603f" : state === "off" ? "#4a4536" : "#6d4a08";
      const edge = state === "ok" ? "#5fdc9a" : state === "off" ? "#8a8470" : "#f0a830";
      x.fillStyle = bg; rr(x, 4, 4, W - 8, H - 8, 20); x.fill();
      x.strokeStyle = edge; x.lineWidth = 5; rr(x, 12, 12, W - 24, H - 24, 15); x.stroke();
      // Invariant code, always LTR, always mono — this is the interlingua
      x.font = `700 62px "IBM Plex Mono", monospace`;
      x.fillStyle = "#ffffff"; x.textBaseline = "middle"; x.direction = "ltr"; x.textAlign = "left";
      x.fillText(code, 28, 54);
      // Localized label underneath
      const ar = ARABIC_RE.test(labelText);
      x.font = faceFor(labelText, 400, 30);
      x.fillStyle = "rgba(255,255,255,0.88)";
      let lab = labelText;
      while (x.measureText(lab).width > W - 60 && lab.length > 6) lab = lab.slice(0, -2);
      if (lab !== labelText) lab += "…";
      drawText(x, lab, ar ? W - 28 : 28, 126, { rtl: ar });
      const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4; return tex;
    }
    const chips = CODING[0].codes.map((cd, k) => {
      const tex = chipTexture(cd.code, t(cd.label), "pending");
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.52),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, side: THREE.DoubleSide }));
      m.position.set(0, 5.1 + k * 0.72, 2.2);
      g.add(m);
      // Confidence ring: fraction of a torus, so confidence is readable not decorative
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.05, 6, 28, Math.PI * 2 * cd.conf),
        lambert("#f0a830", { emissive: "#6a4200", emissiveIntensity: 0.6 }));
      ring.position.set(-1.25, m.position.y, 2.2); ring.visible = false; g.add(ring);
      return { m, tex, ring, data: cd };
    });
    const confirmLab = liveLabel(SCENE.confirmed, { h: 0.62, accent: "#2f7d52" });
    confirmLab.position.set(1.6, 5.1, 2.2); confirmLab.visible = false; g.add(confirmLab);

    let caseIdx = 0, phase = 0, phaseT = 0;
    function rebuild() {
      // Language changed: redraw note and chip faces, keep the code text identical
      noteTex.dispose();
      noteTex = noteTexture(t(CODING[caseIdx].note));
      note.material.map = noteTex; note.material.needsUpdate = true;
      chips.forEach((ch, k) => {
        const cd = CODING[caseIdx].codes[k];
        ch.tex.dispose();
        ch.tex = chipTexture(cd.code, t(cd.label), ch.state || "pending");
        ch.m.material.map = ch.tex; ch.m.material.needsUpdate = true;
      });
    }
    relangHooks.push(rebuild);

    function setCase(i) {
      caseIdx = i % CODING.length;
      phase = 0; phaseT = 0;
      chips.forEach((ch, k) => {
        const cd = CODING[caseIdx].codes[k];
        ch.data = cd; ch.state = "pending";
        ch.tex.dispose(); ch.tex = chipTexture(cd.code, t(cd.label), "pending");
        ch.m.material.map = ch.tex; ch.m.material.needsUpdate = true;
        ch.m.material.opacity = 0;
        ch.ring.visible = false;
        ch.ring.geometry.dispose();
        ch.ring.geometry = new THREE.TorusGeometry(0.26, 0.05, 6, 28, Math.PI * 2 * cd.conf);
        ch.ring.material.color.set("#f0a830");
      });
      confirmLab.visible = false;
      noteTex.dispose(); noteTex = noteTexture(t(CODING[caseIdx].note));
      note.material.map = noteTex; note.material.needsUpdate = true;
      note.material.opacity = 1;
    }

    // Phases: 0 note appears · 1 codes crystallize · 2 clinician confirms · 3 hold · then next case
    function update(dt, active, time) {
      g.visible = active || current === CODING_STOP;
      if (!g.visible) return;
      const sp = active ? 1 : 0.4;
      phaseT += dt * sp;
      note.position.y = 3.4 + Math.sin(time * 1.2) * 0.06;
      if (phase === 0 && phaseT > 1.6) { phase = 1; phaseT = 0; }
      else if (phase === 1) {
        chips.forEach((ch, k) => {
          const appear = smooth(k * 0.45, k * 0.45 + 0.6, phaseT);
          ch.m.material.opacity = appear;
          ch.ring.visible = appear > 0.3;
          ch.ring.rotation.z = -Math.PI / 2;
          ch.ring.scale.setScalar(appear);
        });
        if (phaseT > 2.4) { phase = 2; phaseT = 0; }
      } else if (phase === 2) {
        // The clinician reaches up; the chosen code goes green, the others fade out
        const c = clinicians[NODES[0].id];
        if (c) c.userData.arms[0].rotation.x = -2.2 * smooth(0, 0.5, phaseT);
        if (phaseT > 0.55) {
          chips.forEach((ch) => {
            const want = ch.data.pick ? "ok" : "off";
            if (ch.state !== want) {
              ch.state = want;
              ch.tex.dispose(); ch.tex = chipTexture(ch.data.code, t(ch.data.label), want);
              ch.m.material.map = ch.tex; ch.m.material.needsUpdate = true;
              ch.ring.material.color.set(want === "ok" ? "#5fdc9a" : "#8a8470");
            }
            if (!ch.data.pick) ch.m.material.opacity = Math.max(0.18, ch.m.material.opacity - dt * 0.6);
          });
          const picked = chips.find((ch) => ch.data.pick);
          confirmLab.visible = true;
          confirmLab.position.y = picked ? picked.m.position.y : 5.1;
        }
        if (phaseT > 2.6) { phase = 3; phaseT = 0; }
      } else if (phase === 3) {
        const c = clinicians[NODES[0].id];
        if (c) c.userData.arms[0].rotation.x *= 0.9;
        if (phaseT > 2.2 && active) setCase(caseIdx + 1);
      }
    }
    setCase(0);
    return { g, update, setCase };
  })();

  // --- Replication: packets, acknowledgements, offline queue ---------------
  // A packet is a write in flight. It is not "done" until an ACK comes back the
  // other way. The remote site loses connectivity on a cycle, queues its writes
  // in a visible buffer, then drains when the link returns.
  const packets = [];
  const packetGeo = new THREE.BoxGeometry(0.3, 0.22, 0.3);
  const packetM = lambert("#f0a830", { emissive: "#7a4a00", emissiveIntensity: 0.7 });
  const ackM = lambert("#5fdc9a", { emissive: "#0f4a2a", emissiveIntensity: 0.7 });
  for (let k = 0; k < 26; k++) {
    const m = new THREE.Mesh(packetGeo, packetM.clone());
    m.visible = false; scene.add(m);
    packets.push({ m, seg: null, f: 0, dir: 1, kind: "write", live: false, speed: 0.35 });
  }
  function launch(segIdx, kind, dir) {
    const p = packets.find((q) => !q.live);
    if (!p) return null;
    p.seg = railSegs[segIdx]; p.f = dir > 0 ? 0 : 1; p.dir = dir; p.kind = kind; p.live = true;
    p.speed = kind === "ack" ? 0.55 : 0.32 + Math.random() * 0.1;
    p.m.material = kind === "ack" ? ackM.clone() : packetM.clone();
    p.m.visible = true; p.m.scale.setScalar(kind === "ack" ? 0.7 : 1);
    return p;
  }

  // Offline queue above the remote dispensary
  const queue = (() => {
    const f = facilities.rural;
    const g = new THREE.Group(); g.position.set(f.node.x, f.y + 3.4, f.node.z); scene.add(g);
    const qM = lambert("#f0a830", { emissive: "#7a4a00", emissiveIntensity: 0.6 });
    const boxes = [];
    for (let k = 0; k < 7; k++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.2, 0.26), qM);
      m.position.set((k % 4) * 0.34 - 0.5, Math.floor(k / 4) * 0.28, 0);
      m.visible = false; g.add(m); boxes.push(m);
    }
    const labQ = liveLabel(SCENE.queued, { h: 0.68, accent: "#f0a830" });
    labQ.position.y = 1.3; g.add(labQ);
    const labS = liveLabel(SCENE.synced, { h: 0.68, accent: "#5fdc9a" });
    labS.position.y = 1.3; labS.visible = false; g.add(labS);
    g.visible = false;
    return { g, boxes, labQ, labS, depth: 0, online: true, timer: 0 };
  })();

  // Duplicate merge: two record ghosts converge into one at the health-ID stop
  const merge = (() => {
    const f = facilities.csb;
    const g = new THREE.Group(); g.position.set(f.node.x, f.y + 3.2, f.node.z); scene.add(g);
    const ghostM = () => new THREE.MeshLambertMaterial({ color: "#b9c8d2", emissive: "#2a4450", emissiveIntensity: 0.5, transparent: true, opacity: 0.85 });
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.82), ghostM());
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.82), ghostM());
    g.add(a, b);
    const one = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.08, 0.9),
      new THREE.MeshLambertMaterial({ color: "#f4f8fa", emissive: "#1b7d94", emissiveIntensity: 0.7 }));
    one.visible = false; g.add(one);
    const gl = glow("#7fe4f8", 3.2, 0); g.add(gl);
    const lab = liveLabel(SCENE.merged, { h: 0.72, accent: "#2aa0bd" });
    lab.position.y = 1.5; lab.visible = false; g.add(lab);
    g.visible = false;
    let ph = 0;
    function update(dt, active, time) {
      if (!g.visible) return;
      ph += dt * (active ? 1 : 0.4);
      const cyc = ph % 7;
      if (cyc < 3.2) {
        // Two separate records, drifting apart
        const sep = 0.75 + Math.sin(time * 1.1) * 0.08;
        a.position.set(-sep, Math.sin(time * 1.3) * 0.05, 0); a.rotation.y = -0.25;
        b.position.set(sep, Math.sin(time * 1.3 + 1.6) * 0.05, 0); b.rotation.y = 0.25;
        a.visible = b.visible = true; one.visible = false; lab.visible = false;
        a.material.opacity = b.material.opacity = 0.85;
        gl.material.opacity = 0;
      } else if (cyc < 4.6) {
        // Converging
        const f2 = smooth(3.2, 4.6, cyc);
        a.position.x = -0.75 * (1 - f2); b.position.x = 0.75 * (1 - f2);
        a.rotation.y = -0.25 * (1 - f2); b.rotation.y = 0.25 * (1 - f2);
        a.material.opacity = b.material.opacity = 0.85 * (1 - f2);
        gl.material.opacity = f2 * 0.8;
        one.visible = f2 > 0.6; one.scale.setScalar(Math.max(0.0001, f2));
      } else {
        // One record, one identity
        a.visible = b.visible = false;
        one.visible = true; one.scale.setScalar(1);
        one.position.y = Math.sin(time * 1.4) * 0.05;
        gl.material.opacity = 0.5 + Math.sin(time * 2.5) * 0.15;
        lab.visible = true;
      }
    }
    return { g, update };
  })();

  // "Record arrived first" reveal at the destination
  const ahead = (() => {
    const f = facilities.chu;
    const g = new THREE.Group(); g.position.set(f.node.x, f.y + 2.6, f.node.z + 2.4); scene.add(g);
    const desk = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.0), lambert("#8d7a5c")); g.add(desk);
    const sheet = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.05, 0.78),
      new THREE.MeshLambertMaterial({ color: "#ffffff", emissive: "#2aa0bd", emissiveIntensity: 0.8 }));
    sheet.position.y = 0.1; g.add(sheet);
    const gl = glow("#7fe4f8", 4.2, 0.7); gl.position.y = 0.5; g.add(gl);
    const lab = liveLabel(SCENE.recordAhead, { h: 0.9, accent: "#5fdc9a" });
    lab.position.y = 1.7; g.add(lab);
    g.visible = false;
    return { g, gl, sheet };
  })();

  // Screens-off / no-record markers for the early levels
  const noRecord = (() => {
    const f = facilities.regional;
    const holder = liveLabel(SCENE.noRecord, { h: 0.8, accent: "#c23a2b" });
    holder.position.set(f.node.x, f.y + 4.4, f.node.z);
    scene.add(holder);
    holder.visible = false;
    return holder;
  })();
  const islandMark = (() => {
    const f = facilities.csb;
    const holder = liveLabel(SCENE.island, { h: 0.75, accent: "#a85c00" });
    holder.position.set(f.node.x, f.y + 4.4, f.node.z);
    scene.add(holder);
    holder.visible = false;
    return holder;
  })();
  // Attribution for the public facts quoted on the final stop
  const sourceLab = (() => {
    const holder = liveLabel(SCENE.source, { h: 0.62, accent: "#6b7f8a", bg: "rgba(12,22,28,0.72)" });
    holder.position.set(PORTAL_POS.x, PORTAL_POS.y - 6.5, PORTAL_POS.z);
    scene.add(holder); holder.visible = false;
    return holder;
  })();

  // --- The patient's route -------------------------------------------------
  // The patient traverses the SAME facilities at every level. What changes is
  // what is waiting for them when they arrive. That is the whole argument.
  const ROUTE = ["cabinet", "csb", "regional", "rural", "chu"];
  let legIdx = 0, legF = 0;
  // Put the patient on final approach to a given facility, so selecting a stop always
  // shows someone arriving there rather than mid-walk somewhere off screen.
  function sendPatientTo(nodeId) {
    const dest = ROUTE.indexOf(nodeId);
    if (dest < 0) return;
    legIdx = (dest - 1 + ROUTE.length) % ROUTE.length;
    legF = 0.72;
  }
  const patientPos = new THREE.Vector3();
  function legPoints(i) {
    const a = NODE[ROUTE[i % ROUTE.length]], b = NODE[ROUTE[(i + 1) % ROUTE.length]];
    return [a, b];
  }
  function updatePatient(dt, time) {
    const [a, b] = legPoints(legIdx);
    legF += dt * 0.045;
    if (legF >= 1) { legF = 0; legIdx = (legIdx + 1) % ROUTE.length; }
    const f = legF;
    const x = a.x + (b.x - a.x) * f, z = a.z + (b.z - a.z) * f;
    const gh = heightAt(x, z).h;
    patientPos.set(x, gh, z);
    patient.position.copy(patientPos);
    patient.rotation.y = Math.atan2(-(b.z - a.z), b.x - a.x);
    // Walk cycle, paused briefly at each arrival
    const arriving = f > 0.9 || f < 0.1;
    const sw = arriving ? 0 : Math.sin(time * 7) * 0.5;
    patient.userData.legs[0].rotation.x = sw;
    patient.userData.legs[1].rotation.x = -sw;
    patient.userData.arms[0].rotation.x = -sw * 0.5;
    patient.userData.arms[1].rotation.x = sw * 0.5;
    // The record travels with the patient at low maturity, and ahead of them at high
    const carried = current < RAILS_STOP;
    const target = new THREE.Vector3();
    if (current === LAST) {
      // Already arrived: rest on the clinician's desk, which is the whole point
      target.copy(ahead.g.position).add(new THREE.Vector3(0, 1.1, 0));
    } else if (carried) {
      // In hand, beside the patient
      target.set(x + Math.cos(patient.rotation.y) * 0.1 + 0.45, gh + 1.0, z + 0.3);
    } else {
      // Running ahead down the rail toward the next facility
      const lead = Math.min(1, f + 0.45);
      const lx = a.x + (b.x - a.x) * lead, lz = a.z + (b.z - a.z) * lead;
      target.set(lx, heightAt(lx, lz).h + 1.9, lz);
    }
    record.g.position.lerp(target, Math.min(1, dt * 2.2));
  }

  // --- Level staging -------------------------------------------------------
  // One function decides what the whole scene shows for a given maturity level.
  function stageLevel(i) {
    record.setForm(i, false);
    sendPatientTo(STOPS[i].node);
    // Terminals light up from level 1
    NODES.forEach((n) => {
      const f = facilities[n.id];
      const digital = i >= 1;
      f.screen.material = digital ? screenOnM : screenOffM;
      f.screenGlow.material.opacity = digital ? 0.5 : 0;
    });
    noRecord.visible = i === 0;
    islandMark.visible = i === 1;
    merge.g.visible = i === INS_STOP;
    consent.g.visible = i >= RAILS_STOP;
    queue.g.visible = i >= RAILS_STOP;
    portal.g.visible = i >= PORTAL;
    ahead.g.visible = i === LAST;
    sourceLab.visible = i === LAST;
    // Rails appear from the exchange level; the remote leg comes last
    railSegs.forEach((r) => { r.want = i >= RAILS_STOP ? (r.remote && i < PORTAL ? 0.4 : 1) : 0; });
  }

  // --- Camera director -----------------------------------------------------
  let mode = "frame";
  const goalTarget = new THREE.Vector3(), goalCam = new THREE.Vector3();
  function frameStop(i) {
    const s = STOPS[i];
    if (i === PORTAL) {
      goalTarget.copy(PORTAL_POS); goalCam.set(PORTAL_POS.x - 26, PORTAL_POS.y + 12, PORTAL_POS.z + 30);
      return;
    }
    if (i === LAST) {
      const f = facilities.chu;
      goalTarget.set(f.node.x, f.y + 3.5, f.node.z + 1.5);
      goalCam.set(f.node.x - 14, f.y + 11, f.node.z + 19);
      return;
    }
    if (i === CODING_STOP) {
      // Tight on the note and the candidate codes: this beat has to be legible,
      // so the camera sits close and level with the middle of the chip stack.
      const f = facilities[NODES[0].id];
      goalTarget.set(f.node.x, f.y + 4.9, f.node.z + 2.2);
      goalCam.set(f.node.x - 1.2, f.y + 5.6, f.node.z + 9.2);
      return;
    }
    if (i === RAILS_STOP) {
      // Must contain three things at once: the consent gate near (2,-1), its access
      // log beside it, and the offline queue above the remote site at (34,-30).
      goalTarget.set(18, 3, -14);
      goalCam.set(-7, 27, 25);
      return;
    }
    const f = facilities[s.node] || facilities[NODES[0].id];
    goalTarget.set(f.node.x, f.y + 2.6, f.node.z);
    goalCam.set(f.node.x - 10, f.y + 8.5, f.node.z + 14);
  }
  scene3D.goTo = (i) => {
    stageLevel(i);
    if (i === CODING_STOP) coding.setCase(0);
    frameStop(i);
    $("mOverview").setAttribute("aria-pressed", "false");
    if (reduceMotion) { controls.target.copy(goalTarget); camera.position.copy(goalCam); mode = "frame"; return; }
    mode = "frame";
    cardTravel(true);
    setTimeout(() => cardTravel(false), 700);
    if (pendingBeacon !== null) pendingBeacon = i;
  };
  scene3D.overview = () => {
    mode = "frame";
    goalTarget.set(8, 2, -6); goalCam.set(-18, 72, 76);
    $("mOverview").setAttribute("aria-pressed", "true");
  };
  scene3D.leaveIntro = () => { if (mode === "intro") { mode = "frame"; frameStop(current); } };

  // --- Beacon over the active facility ------------------------------------
  let beaconSprite = null, beaconAge = 0, pendingBeacon = null;
  function beaconAnchor(i) {
    if (i === PORTAL) return PORTAL_POS.clone().add(new THREE.Vector3(0, 6, 0));
    const f = facilities[STOPS[i].node] || facilities[NODES[0].id];
    return new THREE.Vector3(f.node.x, f.y + f.top + 2.4, f.node.z);
  }
  scene3D.beacon = (text, i) => {
    if (beaconSprite) { scene.remove(beaconSprite); beaconSprite.userData.dispose?.(); }
    beaconSprite = label(text, { h: 1.0, accent: "#f0a830", weight: 600, px: 46, bg: "rgba(10,20,26,0.9)" });
    const at = beaconAnchor(i);
    beaconSprite.position.copy(at);
    beaconSprite.userData.base = at.y;
    beaconSprite.userData.sx = beaconSprite.scale.x;
    beaconSprite.userData.sy = beaconSprite.scale.y;
    beaconSprite.scale.set(0.001, 0.001, 1);
    scene.add(beaconSprite); beaconAge = 0;
  };
  scene3D.relang = () => {
    relangHooks.forEach((h) => h());
    if (beaconSprite) scene3D.beacon(t(STOPS[current].bullets)[bulletIdx], current);
  };

  // --- Time of day: dawn at paper, full daylight at continuity ------------
  const TOD = [
    { top: "#2e3f63", hor: "#e8a56a", sun: "#ffb070", el: 0.08, hemi: 0.6, dir: 0.5, tint: "#d8c0a8" },
    { top: "#4f86c0", hor: "#e6dcc0", sun: "#ffe8c0", el: 0.4, hemi: 0.85, dir: 0.8, tint: "#fff6e4" },
    { top: "#5f9fd0", hor: "#dceaf0", sun: "#fff8e8", el: 0.9, hemi: 1.0, dir: 0.95, tint: "#ffffff" },
  ];
  let tod = 0, todGoal = 0, nf = 0;
  const cA = new THREE.Color(), cB = new THREE.Color(), cTmp = new THREE.Color();
  const lerpHex = (a, b, f, out) => out.copy(cA.set(a)).lerp(cB.set(b), f);
  const NIGHT = { top: "#050c18", hor: "#16223c", moon: "#cdd8ff", tint: "#6c7aa6" };
  function applyTOD() {
    const x = tod * 2, k = Math.min(1, Math.floor(x)), f = x - k, a = TOD[k], b = TOD[Math.min(2, k + 1)];
    const dark = smooth(0.15, 0.85, nf);
    lerpHex(a.top, b.top, f, skyU.top.value).lerp(cTmp.set(NIGHT.top), dark);
    lerpHex(a.hor, b.hor, f, skyU.horizon.value).lerp(cTmp.set(NIGHT.hor), dark);
    const dayEl = a.el + (b.el - a.el) * f;
    let el, az;
    if (nf < 0.5) { const q = smooth(0, 0.5, nf); el = dayEl + (-0.22 - dayEl) * q; az = -0.4; lerpHex(a.sun, b.sun, f, skyU.sunCol.value).lerp(cTmp.set("#ff6a28"), q * 0.8); }
    else { const q = smooth(0.5, 1, nf); el = -0.22 + 0.86 * q; az = 0.7; skyU.sunCol.value.set(NIGHT.moon).multiplyScalar(0.55 + 0.25 * q); }
    skyU.sunDir.value.set(Math.cos(el) * Math.cos(az), Math.sin(el) + 0.02, Math.cos(el) * Math.sin(az)).normalize();
    sun.position.copy(skyU.sunDir.value).multiplyScalar(100); sun.color.copy(skyU.sunCol.value);
    const above = smooth(-0.12, 0.12, el);
    sun.intensity = (nf < 0.5 ? (a.dir + (b.dir - a.dir) * f) : 0.4) * above;
    hemi.intensity = (a.hemi + (b.hemi - a.hemi) * f) * (1 - dark) + 0.3 * dark;
    hemi.color.copy(skyU.horizon.value).lerp(cB.set(nf > 0.5 ? "#8fa2d8" : "#ffffff"), 0.5);
    scene.fog.color.copy(skyU.horizon.value); seaU.fogColor.value.copy(skyU.horizon.value);
    lerpHex(a.tint, b.tint, f, groundMat.color).lerp(cTmp.set(NIGHT.tint), dark);
    floraTinted.forEach((m) => m.material.color.copy(groundMat.color));
    seaU.deep.value.set("#0c4a8e").lerp(cTmp.set("#04101f"), dark);
    seaU.shallow.value.set("#2aa0bd").lerp(cTmp.set("#0b2b3c"), dark);
    nightHooks.forEach((h) => h(nf));
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w < 640 ? 62 : 45; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  // Opening shot: low on the patient and their paper carnet
  {
    const a = NODE[ROUTE[0]];
    goalTarget.set(a.x, heightAt(a.x, a.z).h + 1.2, a.z + 1);
    goalCam.set(a.x - 5, heightAt(a.x, a.z).h + 3.2, a.z + 8);
    camera.position.set(a.x - 9, heightAt(a.x, a.z).h + 5, a.z + 14);
    controls.target.copy(goalTarget);
    mode = "intro";
    if (reduceMotion) camera.position.copy(goalCam);
  }
  stageLevel(0);
  applyTOD();
  if (document.fonts) document.fonts.ready.then(() => scene3D.relang());

  // --- Picking: click a facility or the portal to jump to its stop ---------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const pickables = [];
  NODES.forEach((n) => {
    const stopFor = STOPS.findIndex((s) => s.node === n.id);
    if (stopFor < 0) return;
    facilities[n.id].g.traverse((o) => { if (o.isMesh) { o.userData.stop = stopFor; pickables.push(o); } });
  });
  portal.g.traverse((o) => { if (o.isMesh) { o.userData.stop = PORTAL; pickables.push(o); } });
  let down = null;
  canvas.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener("pointerup", (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    if (hit && hit.object.userData.stop !== undefined) { scene3D.leaveIntro(); select(hit.object.userData.stop); }
  });
  controls.addEventListener("start", () => { mode = "free"; $("mOverview").setAttribute("aria-pressed", "false"); });

  // --- Animation loop ------------------------------------------------------
  const clock = new THREE.Clock();
  let time = 0, running = true, writeTick = 0, ackQueue = [];
  document.addEventListener("visibilitychange", () => { running = !document.hidden; clock.getDelta(); });
  const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();

  function frame(dt) {
    time += dt;
    const amb = reduceMotion ? 0.25 : 1;

    // Camera easing
    if (mode !== "free") {
      const k = mode === "intro" ? 0.015 : 0.045;
      controls.target.lerp(goalTarget, k);
      camera.position.lerp(goalCam, k);
      if (mode === "frame" && !reduceMotion) {
        camera.position.x += Math.sin(time * 0.25) * 0.01;
        camera.position.y += Math.sin(time * 0.35) * 0.006;
      }
    }

    // Time of day tracks maturity: dawn at paper, full light at continuity
    todGoal = current / LAST;
    tod += (todGoal - tod) * Math.min(1, dt * 0.9);
    nf += Math.sign(nightGoal - nf) * Math.min(Math.abs(nightGoal - nf), dt * 0.22);
    applyTOD();

    seaU.time.value = time * amb;
    updatePatient(dt * amb, time * amb);
    record.update(dt, time * amb);

    // Rails grow in as capability lands
    railSegs.forEach((r) => {
      const want = r.want || 0;
      r.s += (want - r.s) * Math.min(1, dt * 3);
      r.tube.visible = r.s > 0.02;
      r.tube.scale.y = Math.max(0.0001, r.s);
      r.tube.material.opacity = 1;
    });

    // Consent gate: lifts when a record is cleared to move
    if (consent.g.visible) {
      const open = current >= RAILS_STOP ? (Math.sin(time * 0.5) > -0.2 ? 1 : 0) : 0;
      consent.lift += (open - consent.lift) * Math.min(1, dt * 2);
      consent.pivot.rotation.x = consent.lift * 1.3;
      consent.plates.forEach((p, k) => {
        p.visible = k < consent.written;
        if (p.visible) p.material.emissiveIntensity = 0.4 + (k === consent.written - 1 ? Math.abs(Math.sin(time * 4)) * 0.5 : 0);
      });
    }

    // Remote site connectivity cycles; writes queue while it is dark
    if (queue.g.visible) {
      queue.timer += dt * amb;
      if (queue.timer > (queue.online ? 9 : 5)) { queue.timer = 0; queue.online = !queue.online; }
      const f = facilities.rural;
      f.screenGlow.material.opacity = queue.online ? 0.5 : 0.08;
      queue.boxes.forEach((b, k) => {
        b.visible = k < queue.depth;
        if (b.visible) b.position.y = Math.floor(k / 4) * 0.28 + Math.sin(time * 2 + k) * 0.02;
      });
      queue.labQ.visible = !queue.online && queue.depth > 0;
      queue.labS.visible = queue.online && queue.depth === 0;
    }

    // Write traffic along the rails, with acknowledgements coming back
    if (current >= RAILS_STOP) {
      writeTick += dt * amb;
      if (writeTick > 1.15) {
        writeTick = 0;
        const segIdx = Math.floor(Math.random() * railSegs.length);
        const seg = railSegs[segIdx];
        if (seg.remote && !queue.online) {
          // Offline: the write cannot leave, so it stacks up in the buffer
          queue.depth = Math.min(queue.boxes.length, queue.depth + 1);
        } else if (seg.s > 0.5) {
          launch(segIdx, "write", 1);
          if (seg.remote && queue.depth > 0) queue.depth = Math.max(0, queue.depth - 1);
        }
      }
      // Drain the backlog quickly once the link returns
      if (queue.online && queue.depth > 0 && Math.random() < dt * 2.2) {
        const remoteIdx = railSegs.findIndex((r) => r.remote);
        if (remoteIdx >= 0 && railSegs[remoteIdx].s > 0.5) { launch(remoteIdx, "write", 1); queue.depth--; }
      }
    }
    packets.forEach((p) => {
      if (!p.live) return;
      p.f += dt * p.speed * p.dir * amb;
      const done = p.dir > 0 ? p.f >= 1 : p.f <= 0;
      const f = Math.min(1, Math.max(0, p.f));
      p.seg.curve.getPointAt(f, tmpV);
      p.m.position.copy(tmpV);
      p.m.rotation.y += dt * 3;
      if (done) {
        p.live = false; p.m.visible = false;
        // A write is only complete once the far side acknowledges it
        if (p.kind === "write") {
          ackQueue.push({ seg: p.seg, at: time + 0.35 });
          consent.written = Math.min(consent.plates.length, consent.written + 1);
          if (consent.written >= consent.plates.length) consent.written = 1;
        }
      }
    });
    ackQueue = ackQueue.filter((q) => {
      if (time < q.at) return true;
      const idx = railSegs.indexOf(q.seg);
      if (idx >= 0) launch(idx, "ack", -1);
      return false;
    });

    // Per-level set pieces
    merge.update(dt * amb, current === INS_STOP, time * amb);
    coding.update(dt * amb, current === CODING_STOP, time * amb);

    if (portal.g.visible) {
      portal.core.rotation.y = time * 0.5;
      portal.ring.rotation.z = time * 0.7;
      portal.ring2.rotation.z = -time * 0.5;
      portal.gl.material.opacity = (current >= PORTAL ? 0.45 : 0) + Math.sin(time * 2) * 0.1;
      // Records rising from facilities into the national portal
      if (current >= PORTAL && Math.random() < dt * 1.6) {
        const n = NODES[Math.floor(Math.random() * NODES.length)];
        const p = packets.find((q) => !q.live);
        if (p) {
          p.live = true; p.kind = "portal"; p.m.visible = true; p.m.material = ackM.clone();
          p.m.scale.setScalar(0.6);
          p.seg = { curve: new THREE.CatmullRomCurve3([
            new THREE.Vector3(n.x, facilities[n.id].y + 2, n.z),
            new THREE.Vector3((n.x + PORTAL_POS.x) / 2, PORTAL_POS.y * 0.6, (n.z + PORTAL_POS.z) / 2),
            PORTAL_POS.clone(),
          ]) };
          p.f = 0; p.dir = 1; p.speed = 0.5;
        }
      }
    }

    if (ahead.g.visible) {
      ahead.gl.material.opacity = 0.5 + Math.sin(time * 2.2) * 0.2;
      ahead.sheet.position.y = 0.1 + Math.sin(time * 1.5) * 0.03;
    }

    // Clinicians shift their weight; the one at the coding stop is handled there
    Object.entries(clinicians).forEach(([id, c], k) => {
      if (id === NODES[0].id && current === CODING_STOP) return;
      c.rotation.y = -0.5 + Math.sin(time * 0.6 + k) * 0.3;
      c.userData.arms[0].rotation.x *= 0.92;
    });

    // Beacon pop-in
    if (beaconSprite) {
      beaconAge += dt;
      const e = Math.min(1, beaconAge / 0.6), over = 1 + Math.sin(e * Math.PI) * 0.12;
      const s = reduceMotion ? 1 : (1 - Math.pow(1 - e, 3)) * over;
      beaconSprite.scale.set(beaconSprite.userData.sx * s, beaconSprite.userData.sy * s, 1);
      beaconSprite.position.y = beaconSprite.userData.base + Math.sin(time * 1.6) * 0.12;
    }

    sky.position.copy(camera.position);
    controls.update();
    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(() => {
    if (!running) return;
    frame(Math.min(clock.getDelta(), 0.1));
  });
}

try { initScene(); }
catch (err) {
  const d = document.createElement("div");
  d.className = "err";
  d.textContent = UI[lang].webglFail;
  document.getElementById("app").appendChild(d);
}
applyLang();
select(0);
</script>
</body></html>
